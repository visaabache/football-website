<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hdr"></div>
<main class="wrap" id="main"></main>
<div id="ftr"></div>
<script src="lib.js"></script>
<script>
(async () => {
  await boot();
  const p = (D.news || []).find(x => x.id == new URLSearchParams(location.search).get("id"));
  if (!p) { $("#main").innerHTML = `<p class="empty card">${t("notfound")}</p>`; return; }
  const title = L === "en" && p.titleEn ? p.titleEn : p.title, body = L === "en" && p.bodyEn ? p.bodyEn : p.body;
  seo({ title: title + " | " + S.siteName, path: "news?id=" + p.id, type: "article", desc: body.slice(0, 160),
    ld: { "@context": "https://schema.org", "@type": "NewsArticle", headline: title, datePublished: p.date, inLanguage: L, ...(safeUrl(p.image) ? { image: p.image } : {}) } });
  const m = D.matches.find(x => x.id == p.matchId);
  $("#main").innerHTML = `<article class="card pad"><h1>${esc(title)}</h1>
    <small class="cd">${new Date(p.date).toLocaleDateString(locale(), { timeZone: TZ(), dateStyle: "long" })}</small>
    ${safeUrl(p.image) ? `<img class="cover" src="${esc(p.image)}" alt="">` : ""}
    ${m ? `<div class="list">${card(m)}</div>` : ""}
    <div class="body">${esc(body).replace(/\n/g, "<br>")}</div>
    <p><a href="index.html">${t("back")}</a></p></article>`;
})();
</script>
</body>
</html>
